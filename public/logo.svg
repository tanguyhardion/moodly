<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Static brand mark (favicon). In the app, components/common/MoodlyLogo.vue follows the mood tint instead. -->
  <defs>
    <linearGradient id="moodlyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2a93b" />
      <stop offset="100%" stop-color="#f2677a" />
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="130" fill="url(#moodlyGradient)" />

  <!-- Stylized M / Pulse Graph -->
  <path d="M128 288
           C 128 160, 210 160, 210 240
           C 210 280, 230 300, 256 300
           C 282 300, 302 280, 302 240
           C 302 160, 384 160, 384 288"
        stroke="#1b1622"
        stroke-width="42"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- Data points -->
  <circle cx="128" cy="288" r="21" fill="#1b1622" />
  <circle cx="384" cy="288" r="21" fill="#1b1622" />
</svg>
